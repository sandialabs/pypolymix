name: Run Tests

# events triggering this workflow: PR, push changing src/ or tests/, or manual
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # run all tests
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # the test job runs 3 times - once for each python version
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --extra dev --locked

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: |
          uv run pytest tests/

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          uv run pytest tests/ --cov=src --cov-report=term-missing --cov-report=lcov:coverage.lcov

      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        uses: coverallsapp/github-action@v2
        with:
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage.lcov
