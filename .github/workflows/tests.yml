name: Run Tests

# events triggering this workflow: PR, push changing src/ or tests/, manual, or
# the nightly schedule that drives the regression job
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  # fast feedback: the unit tests only. Tests under tests/regression_tests/ are
  # skipped by default -- see tests/conftest.py.
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # the test job runs 3 times - once for each python version
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --extra dev --locked

      - name: Run tests
        run: |
          uv run pytest tests/

  # the slow end-to-end training tests, plus coverage for the whole suite.
  # Too slow for pull requests: nightly, on demand, and on pushes to main.
  regression:
    name: Regression and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: |
          uv python install 3.12

      - name: Install project and dev dependencies
        run: |
          uv sync --python 3.12 --extra dev --locked

      # --regression runs the whole suite, not just the regression tests, so the
      # reported coverage stays comparable to what it was before the split.
      - name: Run all tests with coverage
        run: |
          uv run pytest tests/ --regression --cov=src --cov-report=term-missing --cov-report=lcov:coverage.lcov

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          repo-token: ${{ secrets.COVERALLS_REPO_TOKEN }}
          file: coverage.lcov
